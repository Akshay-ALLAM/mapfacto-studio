name: Update MapFacto stats

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:          # lets you run it by hand from the Actions tab
  push:                       # also runs when the code changes
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/**", "requirements.txt"]

permissions:
  contents: read  # the robot no longer commits: real numbers go to Supabase, never to the repo
  issues: write   # to open an issue (which emails you) when a platform keeps failing

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 from Oct 2026
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Pull the latest numbers
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python pipeline/run.py

      - name: Check that no key or token would be published
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python pipeline/guard.py

      - name: Open or close alert issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python pipeline/alert.py | while IFS='|' read -r state platform count msg; do
            title="MapFacto: ${platform} is not updating"
            open=$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
            if [ "$state" = "ALERT" ] && [ -z "$open" ]; then
              gh issue create -R "$REPO" --title "$title" --body "${platform} has failed the last ${count} automatic updates.

          Last error: \`${msg}\`

          Most likely fix: the key or token for ${platform} expired. Make a new one and replace its secret in Settings > Secrets and variables > Actions. This issue closes itself after the next successful update."
            elif [ "$state" = "OK" ] && [ -n "$open" ]; then
              gh issue close -R "$REPO" "$open" --comment "${platform} is updating again. Closing automatically."
            fi
          done
