<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MapFacto Studio</title>
  <meta name="description" content="Live views, followers and engagement for the MapFacto channel on YouTube, TikTok, Instagram and Facebook.">
  <meta name="theme-color" content="#eef6fc">
  <link rel="icon" type="image/png" sizes="32x32" href="brand/mapfacto-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="brand/mapfacto-64.png">
  <link rel="apple-touch-icon" href="brand/mapfacto-180.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MapFacto Studio">
  <meta property="og:title" content="MapFacto Studio: live channel dashboard">
  <meta property="og:description" content="Views, followers and engagement for MapFacto on YouTube, TikTok, Instagram and Facebook, updated automatically every 30 minutes.">
  <meta property="og:url" content="https://akshay-allam.github.io/mapfacto-studio/">
  <meta property="og:image" content="https://akshay-allam.github.io/mapfacto-studio/preview-desktop.jpg">
  <meta property="og:image:width" content="2880">
  <meta property="og:image:height" content="1800">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://akshay-allam.github.io/mapfacto-studio/preview-desktop.jpg">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <link rel="preload" href="fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/lenis.css">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/echarts.min.js" defer></script>
  <script src="vendor/gsap.min.js" defer></script>
  <script src="vendor/ScrollTrigger.min.js" defer></script>
  <script src="vendor/lenis.min.js" defer></script>
  <script src="vendor/SplitText.min.js" defer></script>
  <script src="vendor/geo.min.js" defer></script>
  <script src="globe.js" defer></script>
  <script src="motion.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <svg class="contours" id="contours" aria-hidden="true" preserveAspectRatio="xMidYMid slice"></svg>

  <div class="shell">
    <aside class="rail" aria-label="Main navigation">
      <a class="brand" href="#/overview" aria-label="MapFacto Studio, overview">
        <img class="brand-mark" src="brand/mapfacto-64.png" alt="" width="38" height="38">
        <span><span class="brand-name">MapFacto Studio</span><span class="brand-sub">MapFacto channel dashboard</span></span>
      </a>
      <span class="nav-label">Pages</span>
      <nav class="nav" id="nav"></nav>
      <div class="rail-foot" id="railFoot"></div>
    </aside>

    <main id="main">
      <div class="topbar">
        <div class="mobile-brand">
          <img src="brand/mapfacto-64.png" alt="" width="28" height="28">
          MapFacto Studio
        </div>
        <h1 id="pageTitle">Overview</h1>
        <span class="spacer"></span>
        <span class="live" id="live" role="status"><span class="pulse" id="pulse"></span><span id="liveText">Loading…</span></span>
        <button class="btn" id="reload" type="button" aria-label="Reload the latest numbers">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
          <span class="btn-label">Reload</span>
        </button>
      </div>
      <div id="view"><div class="skeleton"></div></div>
      <p class="foot">Numbers update automatically about every 30 minutes. Built with Python, GitHub Actions, GitHub Pages, ECharts and GSAP.</p>
    </main>
  </div>
</body>
</html>
