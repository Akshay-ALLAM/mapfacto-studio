<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MapFacto Studio</title>
  <meta name="description" content="Live views, followers and engagement for the MapFacto channel on YouTube, TikTok, Instagram and Facebook.">
  <meta name="theme-color" content="#eef6fc">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='18' fill='%2310304a'/%3E%3Cpath d='M2 20h36M20 2c-6 6-6 30 0 36M20 2c6 6 6 30 0 36' stroke='%234aa3df' stroke-width='2' fill='none'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/echarts.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="contours" id="contours" aria-hidden="true" preserveAspectRatio="xMidYMid slice"></svg>

  <div class="shell">
    <aside class="rail" aria-label="Main navigation">
      <a class="brand" href="#/overview" aria-label="MapFacto Studio, overview">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="18" fill="#10304a"/>
          <path d="M2 20h36M20 2c-6.5 6-6.5 30 0 36M20 2c6.5 6 6.5 30 0 36M5 11h30M5 29h30" stroke="#4aa3df" stroke-width="1.6" fill="none"/>
          <circle cx="27" cy="14" r="4.2" fill="#fff"/><circle cx="27" cy="14" r="1.8" fill="#10304a"/>
        </svg>
        <span><span class="brand-name">MapFacto Studio</span><span class="brand-sub">Channel dashboard</span></span>
      </a>
      <span class="nav-label">Pages</span>
      <nav class="nav" id="nav"></nav>
      <div class="rail-foot" id="railFoot"></div>
    </aside>

    <main id="main">
      <div class="topbar">
        <div class="mobile-brand">
          <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#10304a"/><path d="M2 20h36M20 2c-6.5 6-6.5 30 0 36M20 2c6.5 6 6.5 30 0 36" stroke="#4aa3df" stroke-width="1.6" fill="none"/></svg>
          MapFacto Studio
        </div>
        <h1 id="pageTitle">Overview</h1>
        <span class="spacer"></span>
        <span class="live" id="live" role="status"><span class="pulse" id="pulse"></span><span id="liveText">Loading…</span></span>
        <button class="btn" id="reload" type="button" aria-label="Reload the latest numbers">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
          <span class="btn-label">Reload</span>
        </button>
      </div>
      <div id="view"><div class="skeleton"></div></div>
      <p class="foot">Numbers update automatically about every 30 minutes. Built with GitHub Actions, GitHub Pages and the YouTube, Instagram and Facebook APIs.</p>
    </main>
  </div>
</body>
</html>
